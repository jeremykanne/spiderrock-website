# Netlify builds the whole site with Eleventy.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Keep search engines from indexing the review site while the redesign is in client review.
# REMOVE THIS BLOCK AT LAUNCH, when the site moves to spiderrock.net.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Leftover section pages whose forms don't submit: send visitors to the working pages.
# `force` is needed because the old pages still exist in the build.
[[redirects]]
  from = "/platform/contact-us/*"
  to = "/contact-us/"
  status = 301
  force = true

[[redirects]]
  from = "/data/contact-us/*"
  to = "/contact-us/"
  status = 301
  force = true

[[redirects]]
  from = "/platform/updates/*"
  to = "/updates/"
  status = 301
  force = true

# The Historical Data overview was retired (kept in _archive/); send old links to the main historical page.
[[redirects]]
  from = "/data/historical-data-analytics/"
  to = "/data/historical-data-analytics/options-greeks-stock-prices/"
  status = 301

# Retired data delivery pages (kept in _archive/); send old links to How We Deliver Data.
[[redirects]]
  from = "/data/data-api/"
  to = "/data/#delivery"
  status = 301

[[redirects]]
  from = "/data/data-analytics/"
  to = "/data/#delivery"
  status = 301

# Retired MLink price sheets (kept in _archive/mlink-pricing/); send old links to the MLink Data Products section.

[[redirects]]
  from = "/data/spiderstream-market-data-api/equity-nbbo-feeds/*"
  to = "/data/spiderstream-market-data-api/#data-products"
  status = 301
  force = true

[[redirects]]
  from = "/data/spiderstream-market-data-api/options-nbbo-feeds/*"
  to = "/data/spiderstream-market-data-api/#data-products"
  status = 301
  force = true

[[redirects]]
  from = "/data/spiderstream-market-data-api/futures-book-feeds/*"
  to = "/data/spiderstream-market-data-api/#data-products"
  status = 301
  force = true

[[redirects]]
  from = "/data/spiderstream-market-data-api/option-implied-trades/*"
  to = "/data/spiderstream-market-data-api/#data-products"
  status = 301
  force = true

[[redirects]]
  from = "/data/spiderstream-market-data-api/equity-options-analytics/*"
  to = "/data/spiderstream-market-data-api/#data-products"
  status = 301
  force = true

[[redirects]]
  from = "/data/spiderstream-market-data-api/future-options-analytics/*"
  to = "/data/spiderstream-market-data-api/#data-products"
  status = 301
  force = true

[[redirects]]
  from = "/data/spiderstream-market-data-api/pdfs/*"
  to = "/data/spiderstream-market-data-api/#data-products"
  status = 301
  force = true
