# Netlify builds the whole site with Eleventy.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Keep search engines from indexing the review site while the redesign is in client review.
# REMOVE THIS BLOCK AT LAUNCH, when the site moves to spiderrock.net.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Leftover section pages whose forms don't submit: send visitors to the working pages.
# `force` is needed because the old pages still exist in the build.
[[redirects]]
  from = "/platform/contact-us/*"
  to = "/contact-us/"
  status = 301
  force = true

[[redirects]]
  from = "/data/contact-us/*"
  to = "/contact-us/"
  status = 301
  force = true

[[redirects]]
  from = "/platform/updates/*"
  to = "/updates/"
  status = 301
  force = true

# The Historical Data overview was retired (kept in _archive/); send old links to the main historical page.
[[redirects]]
  from = "/data/historical-data-analytics/"
  to = "/data/historical-data-analytics/options-greeks-stock-prices/"
  status = 301
