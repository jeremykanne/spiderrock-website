# Decap CMS — News & Updates editor at /admin/
# Each published post is committed to GitHub as updates/posts/<slug>.md; Netlify rebuilds the site.

# DecapBridge login (email/password for editors; PKCE auth is required).
backend:
  name: git-gateway
  repo: jeremykanne/spiderrock-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/eb51be85-7acd-4756-b9d6-dbd099c5c800/pkce
  auth_token_endpoint: /sites/eb51be85-7acd-4756-b9d6-dbd099c5c800/token
  gateway_url: https://gateway.decapbridge.com

  # Record who made each change in the Git history
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# `npm run cms` + `npm start` lets the editor work locally with no login, writing straight to this folder.
local_backend: true

site_url: https://spiderrock.netlify.app
display_url: https://spiderrock.netlify.app
logo_url: /logos/Horizontal/Vector/SVG/SpiderRock%20-%20Logo%20-%20Horizontal%20-%20Color.svg

media_folder: images/uploads        # where uploaded images are saved in the repo
public_folder: /images/uploads      # how pages reference them

collections:
  - name: updates
    label: News & Updates
    label_singular: Update
    description: Posts appear at /updates/ and on the News & Updates listing, newest first.
    folder: updates/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [date, title]
    summary: "{{title}} — {{date}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Publish Date, widget: datetime, format: YYYY-MM-DD, date_format: MMM D, YYYY, time_format: false, picker_utc: true }
      - { name: summary, label: Summary, widget: text, hint: One or two sentences shown on the News & Updates listing. }
      - { name: image, label: Share Image, widget: image, required: false, hint: "Not shown on the site. Kept for link previews when the post is shared (LinkedIn, X). 1200×630 works best." }
      - { name: image_alt, label: Image Description, widget: string, required: false, hint: Describe the image for screen readers. }
      - name: categories
        label: Categories
        widget: select
        multiple: true
        options: ["Data & Analytics", "Trading Platform", "Partnerships", "Events", "White Papers", "Videos"]
      - { name: body, label: Article, widget: markdown, buttons: [bold, italic, link, heading-three, bulleted-list, numbered-list, quote], editor_components: [image] }
